services:

  qdrant:
    image: qdrant/qdrant
    container_name: rag-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  n8n:
    image: n8nio/n8n:2.13.0
    container_name: rag-n8n
    ports:
      - "5678:5678"
    env_file:
      - .env
    environment:
      - NODE_FUNCTION_ALLOW_BUILTIN=*
      - NODE_FUNCTION_ALLOW_EXTERNAL=*
      - N8N_BLOCK_SVC_REGISTRATION_EMAIL=true
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
      - N8N_BLOCK_NODES_IMPORT_CHECK=true
      - N8N_FILESYSTEM_ALLOWED_PATHS=/home/node/.n8n-files
      - N8N_SECURE_COOKIE=false
      - N8N_FILESYSTEM_ALLOWED_PATHS=/home/node/.n8n-files,/home/node/.n8n-files-orig
    volumes:
      - ./n8n/data:/home/node/.n8n
      - "${PATH_DATA}:/home/node/.n8n-files"
      - "${PATH_DATA_ORIG}:/home/node/.n8n-files-orig"
    depends_on:
      - qdrant

volumes:
  qdrant_storage:
    external: true

networks:
  default:
    name: n8n-rag-net
